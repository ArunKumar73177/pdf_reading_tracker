name: example
description: >
  Demonstrates real-world integration of pdf_reading_tracker with ALH PDF View.
  Shows progress persistence, bookmark management, and page restoration using
  SQLite storage through the pdf_reading_tracker package.
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  pdf_reading_tracker:
    path: ../

  alh_pdf_view: ^2.3.3

  # Required to copy bundled PDF assets to a writable temp path.
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sample.pdf
    - assets/sample2.pdf