name: example
description: >
  Demonstrates real-world integration of pdf_reading_tracker v2.1.0:
  file-picker PDF selection, reading progress, bookmarks, merge/split
  with real device files, recent PDFs, continue reading, jump to page,
  and bookmark notes.
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  pdf_reading_tracker:
    path: ../

  # path is used in PdfOperationsScreen for basename / basenameWithoutExtension.
  path: ^1.9.0

  # path_provider is used in PdfOperationsScreen for getTemporaryDirectory.
  path_provider: ^2.1.0

  # file_picker is re-exported through pdf_reading_tracker but listed here
  # explicitly so the example can call FilePicker.platform directly.
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # No bundled assets required — all PDFs come from the device file picker.
  # sample.pdf / sample2.pdf are kept only so the existing merge/split
  # integration tests (if any) continue to compile. Remove them freely
  # once those tests are updated.