  progress, and manages bookmarks, all backed by SQLite.

version: 2.0.0

homepage: https://github.com/ArunKumar73177/pdf_reading_tracker
repository: https://github.com/ArunKumar73177/pdf_reading_tracker
issue_tracker: https://github.com/ArunKumar73177/pdf_reading_tracker/issues

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Persistence
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5

  # PDF Rendering  ← NEW
  alh_pdf_view: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

