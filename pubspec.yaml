name: pdf_reading_tracker

description: >
  A complete Flutter PDF reader package — renders PDFs, tracks reading
  progress, manages bookmarks, supports PDF merge and split operations,
  lets users pick PDFs from their device, and shows recent/continue-reading
  sections. All backed by SQLite.

version: 2.1.0

homepage: https://github.com/ArunKumar73177/pdf_reading_tracker
repository: https://github.com/ArunKumar73177/pdf_reading_tracker
issue_tracker: https://github.com/ArunKumar73177/pdf_reading_tracker/issues

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter

  # Persistence
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5

  # PDF Rendering
  syncfusion_flutter_pdfviewer: ^27.1.48

  # PDF Processing (merge / split)
  syncfusion_flutter_pdf: ^27.1.48

  # User PDF picking
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter: