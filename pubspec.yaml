name: pdf_reading_tracker

description: >
  Feature-rich Flutter PDF reader with reading progress, bookmarks,
  highlights, text-anchored notes, appearance theming, SQLite persistence,
  and PDF merge/split — offline-first, built on Syncfusion PDF Viewer.

version: 4.0.1

homepage: https://github.com/ArunKumar73177/pdf_reading_tracker
repository: https://github.com/ArunKumar73177/pdf_reading_tracker
issue_tracker: https://github.com/ArunKumar73177/pdf_reading_tracker/issues

topics:
  - pdf
  - pdf-viewer
  - annotations
  - bookmarks
  - sqlite

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter

  # Persistence
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5

  # PDF Rendering
  syncfusion_flutter_pdfviewer: ^27.1.48

  # PDF Processing
  syncfusion_flutter_pdf: ^27.1.48

  # File Import
  file_picker: ^8.1.2

  # Reader chrome (Phase 3A)
  wakelock_plus: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter: