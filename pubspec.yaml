name: pdf_reading_tracker

description: >
  Flutter PDF reader with progress tracking, bookmarks, annotations,
  notes, search, host toolbar integration, offline SQLite persistence,
  and PDF merge/split.

version: 4.1.0

homepage: https://github.com/ArunKumar73177/pdf_reading_tracker
repository: https://github.com/ArunKumar73177/pdf_reading_tracker
issue_tracker: https://github.com/ArunKumar73177/pdf_reading_tracker/issues

topics:
  - pdf
  - pdf-viewer
  - annotations
  - sqlite
  - ebook

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter

  # Persistence
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5

  # PDF Rendering
  syncfusion_flutter_pdfviewer: ^27.1.48

  # PDF Processing
  syncfusion_flutter_pdf: ^27.1.48

  # File Import
  file_picker: ^8.1.2

  # Reader Features
  wakelock_plus: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.arunkumar.pdf_reading_tracker
        pluginClass: PdfReadingTrackerPlugin